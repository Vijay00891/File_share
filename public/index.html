<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f4f5f2">
    <title>Local File Share</title>
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <div>
            <h1>Local File Share</h1>
            <p>Share files with devices on the same Wi-Fi</p>
          </div>
        </div>
        <div class="status" id="status"><span class="pulse"></span><span>Connecting</span></div>
      </header>

      <section class="grid">
        <div class="card upload-card">
          <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Choose files to upload">
            <input id="fileInput" type="file" multiple hidden>
                        <h2>Drop files here</h2>
            <p>or choose them from this device. No size limit.</p>
            <button class="btn primary" id="chooseButton" type="button">Choose files</button>
          </div>
          <div class="queue" id="queue" aria-live="polite"></div>
        </div>

        <aside class="card share-card">
          <h2>Open on another device</h2>
          <div class="qr-wrap"><canvas id="qr" width="400" height="400" aria-label="QR code for the share address"></canvas></div>
          <div class="addresses" id="addresses"></div>
        </aside>
      </section>

      <section class="card files-card">
        <div class="section-header">
          <div>
            <h2>Available files <span class="count" id="count">0</span></h2>
          </div>
          <div class="header-tools">
            <input class="search" id="search" type="search" placeholder="Search files" aria-label="Search files">
            <button class="btn ghost" id="refreshButton" type="button">Refresh</button>
          </div>
        </div>
        <div class="files" id="files"></div>
      </section>
    </main>
    <div class="toast" id="toast" role="status"></div>

    <script src="/qrcode.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
