plugins {
    id "com.android.application"
}

android {
    namespace "com.vijay.localfileshare"
    compileSdk 35

    defaultConfig {
        applicationId "com.vijay.localfileshare"
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName "3.1"
    }

    compileOptions {
        encoding "UTF-8"
    }

    sourceSets {
        main.assets.srcDirs += layout.buildDirectory.dir("webAssets")
    }
}

// The phone serves the same web UI as the Node server: bundle ../../public as assets/public.
tasks.register("syncWebAssets", Copy) {
    from "${rootDir}/../public"
    into layout.buildDirectory.dir("webAssets/public")
}

tasks.matching { it.name == "preBuild" }.configureEach {
    dependsOn "syncWebAssets"
}

dependencies {
    // QR code encoding and decoding (pure Java, no Android dependencies).
    implementation "com.google.zxing:core:3.5.3"
}
