plugins {
    id "com.android.application"
}

android {
    namespace "com.vijay.localfileshare"
    compileSdk 35

    defaultConfig {
        applicationId "com.vijay.localfileshare"
        minSdk 23
        targetSdk 35
        versionCode 6
        versionName "3.3"
    }

    compileOptions {
        encoding "UTF-8"
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    sourceSets {
        main.assets.srcDirs += layout.buildDirectory.dir("webAssets")
    }
}

// The phone serves the same web UI as the Node server: bundle ../../public as assets/public.
tasks.register("syncWebAssets", Copy) {
    from "${rootDir}/../public"
    into layout.buildDirectory.dir("webAssets/public")
}

tasks.matching { it.name == "preBuild" }.configureEach {
    dependsOn "syncWebAssets"
}

dependencies {
    // QR code encoding and decoding (pure Java, no Android dependencies).
    implementation "com.google.zxing:core:3.5.3"

    testImplementation "junit:junit:4.13.2"
    // Real JSON parser for JVM tests; on the phone Android provides it.
    testImplementation "org.json:json:20240303"
}
